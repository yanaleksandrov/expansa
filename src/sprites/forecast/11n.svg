	</g>
	<g transform="translate(0,-3), scale(1.1)">
		<path class="am-weather-stroke" fill="#FFC107" stroke="#fff" stroke-width="1.5" d="M15 15h6l-4 6.6h3.8L12.4 31l3.2-7H12l3-9z"/>
	</g>
</svg>