# Expansa rules for nginx, the counterpart of .htaccess for Apache.
#
# Include it inside your server block; the site file sets what differs between installations:
#
#   upstream expansa-php {
#       server unix:/run/php/php8.4-fpm.sock;   # or 127.0.0.1:9000, or php:9000 in Docker
#   }
#
#   server {
#       listen      80;
#       server_name example.com;
#       root        /path/to/expansa-cms;        # the folder with index.php
#
#       include /path/to/expansa-cms/nginx.conf;
#   }
#
# Only index.php runs: every other request that is not a static file goes through it, like
# `php artisan serve` does in server.php. Expansa must be the root of the site (its own domain or subdomain).

index index.php;
charset utf-8;

# redirects keep the scheme, host and port of the request, also behind a proxy or on a custom port
absolute_redirect off;

# the largest upload; keep it at least upload_max_filesize and post_max_size of PHP
client_max_body_size 64m;

# hidden files (.git, .htaccess), the configuration and the console are never served
location ~ /\.(?!well-known/) {
    deny all;
}

location ~ ^/(env(\.install|\.example)?\.php|artisan|nginx\.conf)$ {
    deny all;
}

# the storage (logs, AI tasks, quarantine) and the compiled views
location ^~ /storage/ {
    deny all;
}

location ^~ /cache/views/ {
    deny all;
}

# assets: served as files, cached by the browser; a missing one is answered by the app
location ~* \.(?:css|js|mjs|map|json|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|mp4|webm|pdf|webmanifest)$ {
    try_files $uri /index.php$is_args$args;
    expires 30d;
    access_log off;
}

# no trailing slash, then the file or the front controller
location / {
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri /index.php$is_args$args;
}

# every other PHP file is a part of the code, not a page: the front controller answers, usually with 404
location ~ \.php$ {
    rewrite ^ /index.php last;
}

location = /index.php {
    include fastcgi_params;

    fastcgi_pass  expansa-php;
    fastcgi_index index.php;

    # the app takes its base path from SCRIPT_NAME, the same as under Apache
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_param DOCUMENT_ROOT   $document_root;
    fastcgi_param HTTPS           $https if_not_empty;

    fastcgi_read_timeout 120s;
    fastcgi_buffers      16 16k;
    fastcgi_buffer_size  32k;
}
